<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <title>Sarvesh — Profile card</title>
    <meta name="description" content="Sarvesh’s embeddable software, automation and AI profile." />
    <link rel="canonical" href="{{ site_root | escape }}" />
    <link rel="icon" href="assets/favicon-s.svg" type="image/svg+xml" />

  <body>
    <main class="profile-card">
      <div class="profile-copy">
        <span class="eyebrow">SOFTWARE · AUTOMATION · AI</span>
        <h1>Sarvesh<span>.</span></h1>
        <p>Software developer.<br />Automation engineer.</p>
        <p class="description">Connecting workflows, enterprise platforms, and practical AI.</p>
        <a class="portfolio-link" href="./" target="_blank" rel="noopener noreferrer"
          >View portfolio
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="M5 19 19 5M5 5h14v14" /></svg></a
        ><a class="email-link" href="mailto:sarvesh.official@icloud.com">Say hello</a>
      </div>
      <div class="portrait">
        <span class="aura" aria-hidden="true"></span
        ><img
          src="assets/sarvesh-portrait.webp"
          alt="Portrait of Sarvesh"
          width="1254"
          height="1254"
          decoding="async"
        />
      </div>
    </main>
  </body>
